name: Refresh GitHub profile cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Vahidkh69&show_icons=true&theme=default&hide_border=false&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Vahidkh69&layout=compact&theme=default&hide_border=false&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Switch README to locally generated cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace("https://github-stats-extended.vercel.app/api?username=Vahidkh69&show_icons=true&theme=default&hide_border=false&include_all_commits=true&rank_icon=github", "./profile/stats.svg")
          s = s.replace("https://github-stats-extended.vercel.app/api/top-langs/?username=Vahidkh69&layout=compact&theme=default&hide_border=false&langs_count=8", "./profile/top-langs.svg")
          p.write_text(s)
          PY

      - name: Commit refreshed SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile statistics"
            git push
          fi
